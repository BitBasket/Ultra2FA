<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra2FA: TOTP on all of your devices!</title>
    <link rel="stylesheet" href="app.css"/>
    <link rel="stylesheet" href="export.css"/>
</head>
<body>
    <header>
        <h1>Ultra 2FA</h1>
        <div id="filterBox">
            <label for="filter">Filter:</label>
            <input type="text" id="filter" autofocus="autofocus" />
        </div>
    </header>
    <main>
        <section class="token-container" id="tokens">
            <div class="token-wrapper">
            </div>
        </section>
        <section id="controls">
            <button id="settings-btn">Settings</button>
            <button id="export-btn">Change Passkey + Export</button>
            <button id="add-btn">Add</button>
        </section>
        <section id="overlays">
            <!-- Add Account Popup -->
            <div class="overlay" id="add-account-popup-overlay"></div>

            <div class="popup" id="add-account-popup">
                <form id="add-account-form">
                    <div class="input-row">
                        <div style="flex: 1;">
                            <label for="account-1">Account</label>
                            <input type="text" id="account-1" name="account[]">
                        </div>
                        <div style="flex: 1;">
                            <label for="secret-1">Secret</label>
                            <input type="text" id="secret-1" name="secret[]">
                        </div>
                        <button type="button" id="add-row-btn"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="additional-rows"></div>
                    <div class="popup-actions">
                        <button type="submit" id="add-account">Add</button>
                        <button type="button" class="cancel">Cancel</button>
                    </div>
                    <div class="error-message" id="error-message"></div>
                </form>
            </div>

            <div class="overlay" id="passkey-popup-overlay"></div>
            <div class="popup" id="passkey-popup">
                <form id="passkey-form">
                    <label for="passkey">Enter your passkey:</label>
                    <div class="error-message" style="display: block"></div>
                    <input type="password" id="passkey" name="passkey" required="required" autofocus="autofocus"/>
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="overlay" id="file-upload-popup-overlay"></div>
            <div class="popup" id="file-upload-popup">
                <form id="file-upload-form">
                    <label for="file-upload">Restore from your encrypted 2FA secrets file:</label>
                    <input type="file" id="file-upload" name="file-upload" accept=".aes" required>
                    <div class="popup-actions">
                        <button type="submit">Load from file-upload</button>
                        <button type="button" class="cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script type="module" src="./main.js"></script>
</body>
</html>
